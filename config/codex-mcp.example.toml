# Demo 03: static token for localhost presentation use only.
# Replace the Demo 02 hotel_reservations entry; do not keep duplicate table names.
[mcp_servers.hotel_reservations]
url = "http://127.0.0.1:5057/mcp/reservations"
http_headers = { Authorization = "Bearer 123456" }
startup_timeout_sec = 30
tool_timeout_sec = 300

[mcp_servers.hotel_stays]
